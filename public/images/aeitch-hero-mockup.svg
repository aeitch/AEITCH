  <text x="300" y="265" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">AI Agent &amp; Real-Time Query Scale</text>
  <text x="300" y="285" fill="#ffffff" fill-opacity="0.5" font-family="sans-serif" font-size="12">Dynamic production load balancing across multi-region VPC nodes</text>

  <!-- Chart Axis & Waves -->
