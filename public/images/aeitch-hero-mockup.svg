    <text x="1030" y="345" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ORCHESTRATOR</text>
    <text x="1030" y="360" fill="#e9800a" font-family="monospace" font-size="9" text-anchor="middle">ACTIVE // vLLM MESH</text>

    <!-- Connectors -->
    <line x1="1030" y1="370" x2="960" y2="430" stroke="#e9800a" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="1030" y1="370" x2="1100" y2="430" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Worker 1 -->
    <rect x="915" y="430" width="105" height="50" rx="10" fill="#000000" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="967" y="455" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">POD-ALPHA</text>
    <text x="967" y="470" fill="#ffffff" fill-opacity="0.5" font-family="monospace" font-size="9" text-anchor="middle">GPU H100 x8</text>

    <!-- Worker 2 -->
    <rect x="1045" y="430" width="105" height="50" rx="10" fill="#000000" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="1097" y="455" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">POD-BETA</text>
    <text x="1097" y="470" fill="#ffffff" fill-opacity="0.5" font-family="monospace" font-size="9" text-anchor="middle">RAG Qdrant</text>

    <!-- Connectors to DB -->
    <line x1="967" y1="480" x2="1030" y2="530" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="1097" y1="480" x2="1030" y2="530" stroke="#e9800a" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- DB Storage Node -->
    <rect x="965" y="530" width="130" height="50" rx="10" fill="#000000" stroke="#e9800a" stroke-width="2" />
    <text x="1030" y="555" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">POSTGRES + VECTOR</text>
    <text x="1030" y="570" fill="#e9800a" font-family="monospace" font-size="9" text-anchor="middle">ZERO-LOSS REPLICATION</text>
  </g>

  <!-- Asset replacement watermark label -->
  <g opacity="0.6">
    <rect x="30" y="655" width="340" height="18" fill="none" />
    <text x="35" y="666" fill="#e9800a" font-family="monospace" font-size="10" font-weight="bold">
      [aeitch.com/asset: aeitch-hero-mockup.svg - replaceable]
