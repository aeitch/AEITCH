    <line x1="300" y1="390" x2="840" y2="390" />
    <line x1="300" y1="450" x2="840" y2="450" />
    <line x1="300" y1="510" x2="840" y2="510" />
    <line x1="300" y1="570" x2="840" y2="570" />
  </g>

  <!-- Ambient Wave fill under curve -->
  <path d="M 300 550 Q 380 490, 440 510 T 580 410 T 700 370 T 840 310 L 840 570 L 300 570 Z" fill="#e9800a" fill-opacity="0.08" />

  <!-- Wave line 1 (Accent) -->
  <path d="M 300 550 Q 380 490, 440 510 T 580 410 T 700 370 T 840 310" fill="none" stroke="#e9800a" stroke-width="3" filter="url(#glow)" />
  <!-- Wave line 2 (White) -->
  <path d="M 300 520 Q 380 440, 460 480 T 600 390 T 720 330 T 840 270" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6" />

  <!-- Data point markers -->
  <circle cx="580" cy="410" r="5" fill="#e9800a" stroke="#ffffff" stroke-width="2" />
  <circle cx="700" cy="370" r="5" fill="#e9800a" stroke="#ffffff" stroke-width="2" />
  <circle cx="840" cy="310" r="7" fill="#ffffff" stroke="#e9800a" stroke-width="3" />
  
  <rect x="760" y="240" width="80" height="24" rx="6" fill="#e9800a" />
  <text x="800" y="256" fill="#000000" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">LIVE FEED</text>

