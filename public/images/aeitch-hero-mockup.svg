  <rect x="45" y="470" width="190" height="160" rx="12" fill="#000000" stroke="#e9800a" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="495" fill="#e9800a" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1">ARCHITECT POD</text>
  <text x="60" y="525" fill="#ffffff" font-family="monospace" font-size="24" font-weight="bold">0 ms</text>
  <text x="60" y="545" fill="#ffffff" fill-opacity="0.6" font-family="sans-serif" font-size="11">Downtime in 180 Days</text>
