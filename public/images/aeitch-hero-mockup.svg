  <circle cx="36" cy="27" r="6" fill="#e9800a" />
  <circle cx="56" cy="27" r="6" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="76" cy="27" r="6" fill="#ffffff" fill-opacity="0.1" />
  
  <text x="120" y="32" fill="#ffffff" fill-opacity="0.6" font-family="monospace" font-size="12" font-weight="bold">
    AEITCH CONTROL PLANE // PRODUCTION ENTERPRISE TELEMETRY // US-EAST
  </text>
  <rect x="980" y="15" width="180" height="24" rx="12" fill="#000000" stroke="#e9800a" stroke-width="1" />
  <circle cx="995" cy="27" r="4" fill="#e9800a" />
  <text x="1010" y="31" fill="#e9800a" font-family="monospace" font-size="11" font-weight="bold">SYSTEM NORMAL 99.99%</text>

  <!-- Left Sidebar Panel -->
  <rect x="30" y="75" width="220" height="575" rx="16" fill="#000000" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
  <text x="50" y="110" fill="#e9800a" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="2">ACTIVE PIPELINES</text>
  
  <!-- Sidebar Nav items -->
  <rect x="45" y="130" width="190" height="38" rx="8" fill="#e9800a" fill-opacity="0.15" stroke="#e9800a" stroke-width="1" />
  <text x="60" y="154" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">AI Agent Swarm</text>
  <circle cx="215" cy="149" r="4" fill="#e9800a" />

