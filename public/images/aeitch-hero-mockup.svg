    <text x="295" y="105" fill="#ffffff" fill-opacity="0.6" font-family="sans-serif" font-size="12" font-weight="bold">THROUGHPUT VOLUME</text>
    <text x="295" y="148" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="900">4.82B</text>
    <text x="295" y="180" fill="#e9800a" font-family="monospace" font-size="12" font-weight="bold">↑ 48.2% vs Last Quarter</text>
    <circle cx="510" cy="115" r="14" fill="#e9800a" fill-opacity="0.15" stroke="#e9800a" />
    <path d="M 505 115 L 515 115 M 510 110 L 515 115 L 510 120" stroke="#e9800a" stroke-width="1.5" fill="none" />

