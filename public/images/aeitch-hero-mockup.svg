<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9800a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="680" rx="24" fill="url(#bg-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="560" x2="1200" y2="560" />
    
    <line x1="160" y1="0" x2="160" y2="680" />
    <line x1="320" y1="0" x2="320" y2="680" />
    <line x1="480" y1="0" x2="480" y2="680" />
    <line x1="640" y1="0" x2="640" y2="680" />
    <line x1="800" y1="0" x2="800" y2="680" />
    <line x1="960" y1="0" x2="960" y2="680" />
    <line x1="1120" y1="0" x2="1120" y2="680" />
