    <text x="895" y="148" fill="#e9800a" font-family="sans-serif" font-size="32" font-weight="900">-42.8%</text>
    <text x="895" y="180" fill="#ffffff" fill-opacity="0.8" font-family="monospace" font-size="12">FinOps Automated Savings</text>
