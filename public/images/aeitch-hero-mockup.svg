  <rect x="45" y="280" width="190" height="38" rx="8" fill="#000000" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="60" y="304" fill="#ffffff" fill-opacity="0.7" font-family="sans-serif" font-size="13">Sovereign LLMs</text>

